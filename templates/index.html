<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشف الاحتيال</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(45deg, #0E155E, #206ABC, #7997E6, #B37AD4, #CAA9F3);
            background-size: 400% 400%;
            animation: waveGradient 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes waveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(14, 21, 94, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(202, 169, 243, 0.8);
            letter-spacing: 1px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 25px;
            font-size: 18px;
            font-weight: 700;
            transition: color 0.3s, text-shadow 0.3s;
        }

        nav a:hover {
            color: #CAA9F3;
            text-shadow: 0 0 8px rgba(202, 169, 243, 0.8);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(202, 169, 243, 0.3);
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(14, 21, 94, 0.5);
            transform: translateY(40px);
            opacity: 0;
            animation: slideUp 1.2s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            margin-top: 0;
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        input[type="text"] {
            width: 85%;
            padding: 18px 20px;
            margin-bottom: 25px;
            border: 2px solid transparent;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #0E155E;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        input[type="text"]:focus {
            border-color: #B37AD4;
            box-shadow: 0 0 20px rgba(179, 122, 212, 0.5), inset 0 2px 5px rgba(0,0,0,0.1);
            transform: scale(1.02);
        }

        button {
            background: linear-gradient(135deg, #206ABC, #B37AD4);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(32, 106, 188, 0.4);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(202, 169, 243, 0.6);
            background: linear-gradient(135deg, #7997E6, #CAA9F3);
        }

        #resultContainer {
            margin-top: 35px;
            min-height: 60px;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #resultContainer.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #result {
            background: rgba(14, 21, 94, 0.6);
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            border-right: 6px solid #CAA9F3;
            color: #ffffff;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        footer {
            background: rgba(14, 21, 94, 0.7);
            backdrop-filter: blur(5px);
            text-align: center;
            padding: 25px;
            margin-top: auto;
            border-top: 1px solid rgba(121, 151, 230, 0.2);
        }

        footer p {
            margin: 8px 0;
            color: #CAA9F3;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .copy-text {
            color: #7997E6;
            font-size: 14px;
            font-weight: 400;
        }

        .icon-link {
            color: #ffffff;
            margin-right: 20px;
            cursor: pointer;
            transition: color 0.3s, transform 0.3s;
            display: inline-flex;
            align-items: center;
        }
        
        .icon-link:hover {
            color: #CAA9F3;
            transform: scale(1.1);
        }
        
        .icon-link svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: rgba(14, 21, 94, 0.9);
            color: #ffffff;
            text-align: center;
            border-radius: 10px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Tajawal', sans-serif;
            border: 1px solid #CAA9F3;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">كاشف الاحتيال</div>
        <nav>
            <a href="https://github.com/fahdgxmain" target="_blank" class="icon-link">
                <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            </a>
            <span onclick="copyEmail()" class="icon-link">
                <svg viewBox="0 0 24 24"><path d="M12 12.713l-11.985-9.713h23.97l-11.985 9.713zm0 2.574l-12-9.725v15.438h24v-15.438l-12 9.725z"/></svg>
            </span>
        </nav>
    </header>
    
    <div id="toast">تم نسخ الايميل</div>

    <main>
        <div class="glass-panel">
            <h1>فحص الروابط المشبوهة</h1>
            <input type="text" id="urlInput" placeholder="ضع الرابط هنا...">
            <button onclick="scanUrl()">فحص الرابط</button>
            
            <div id="resultContainer">
                <div id="result"></div>
            </div>
        </div>
    </main>

    <footer id="about">
        <p>مبرمج مشروع كاشف الاحتيال فهد العمري من طلاب مدرسة نون النموذجية</p>
        <p class="copy-text">&copy; 2026 جميع الحقوق محفوظة</p>
    </footer>

    <script>
        function scanUrl() {
            const url = document.getElementById("urlInput").value;
            const resultContainer = document.getElementById("resultContainer");
            const resultText = document.getElementById("result");

            resultContainer.classList.remove("show");
            
            if (!url.trim()) {
                setTimeout(() => {
                    resultText.innerHTML = "الرجاء إدخال رابط صحيح للبدء بالفحص.";
                    resultContainer.classList.add("show");
                }, 300);
                return;
            }

            setTimeout(() => {
                resultText.innerHTML = "جاري الفحص والتحليل...";
                resultContainer.classList.add("show");
            }, 300);

            fetch('http://127.0.0.1:5000/scan', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url: url })
            })
            .then(response => response.json())
            .then(data => {
                resultContainer.classList.remove("show");
                setTimeout(() => {
                    resultText.innerHTML = `<strong>النتيجة:</strong> ${data.status} <br> <strong>التفاصيل:</strong> ${data.details}`;
                    resultContainer.classList.add("show");
                }, 400); 
            })
            .catch(error => {
                resultContainer.classList.remove("show");
                setTimeout(() => {
                    resultText.innerHTML = "حدث خطأ أثناء الاتصال بالخادم.";
                    resultContainer.classList.add("show");
                }, 400);
            });
        }

        function copyEmail() {
            navigator.clipboard.writeText("fahdgxmain123@gmail.com").then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { 
                    toast.className = toast.className.replace("show", ""); 
                }, 3000);
            });
        }
    </script>
</body>
</html>
